name: Publicar Vigia Local
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Publicar apenas o serviço e o site, após aplicar migrações pela conexão administrativa'
        required: false
        type: boolean
        default: false
      android_release_tag:
        description: 'Tag existente para publicar apenas o Android e o site'
        required: false
        type: string

jobs:
  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar instalador
        shell: pwsh
        run: |
          dotnet run --project tests/Tracking/Tracking.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
          ./scripts/build-windows.ps1 -Version $env:GITHUB_REF_NAME.Substring(1)
      - name: Publicar no GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME dist/VigiaLocal-Setup.exe dist/SHA256SUMS.txt --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME dist/VigiaLocal-Setup.exe dist/SHA256SUMS.txt --verify-tag --title "Vigia Local $env:GITHUB_REF_NAME" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  android:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.android_release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar e assinar o APK
        env:
          KEYSTORE_BASE64: ${{ secrets.VIGIA_ANDROID_KEYSTORE }}
          VIGIA_SIGNING_PASSWORD: ${{ secrets.VIGIA_ANDROID_PASSWORD }}
          VIGIA_TAG: ${{ inputs.android_release_tag || github.ref_name }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$VIGIA_SIGNING_PASSWORD"
          [[ "$VIGIA_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          export VIGIA_SIGNING_FILE="$RUNNER_TEMP/vigia.p12"
          export VIGIA_VERSION="${VIGIA_TAG#v}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$VIGIA_SIGNING_FILE"
          trap 'rm -f "$VIGIA_SIGNING_FILE"' EXIT
          gradle -p android --no-daemon assembleRelease
          mkdir -p dist
          cp android/build/outputs/apk/release/*-release.apk dist/VigiaLocal-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/VigiaLocal-Android.apk
          (cd dist && sha256sum VigiaLocal-Android.apk > SHA256SUMS-Android.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            dist/VigiaLocal-Android.apk
            dist/SHA256SUMS-Android.txt
  release-android:
    needs: [windows, android]
    if: always() && needs.android.result == 'success' && (needs.windows.result == 'success' || inputs.android_release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist
      - name: Publicar APK no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VIGIA_TAG: ${{ inputs.android_release_tag || github.ref_name }}
        run: gh release upload "$VIGIA_TAG" dist/VigiaLocal-Android.apk dist/SHA256SUMS-Android.txt --clobber
  cloudflare:
    needs: release-android
    if: always() && (needs.release-android.result == 'success' || inputs.deploy_only == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verificar contagem e avisos
        run: node --test tests/api-counting.test.js
      - name: Publicar o serviço de avisos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 68c9669a40bccfdc431001cabe4fdbb2
        run: npm run deploy -- --keep-vars
      - name: Publicar vigia-local.pages.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 68c9669a40bccfdc431001cabe4fdbb2
        run: npx wrangler pages deploy --cwd pages --project-name vigia-local --branch main
