name: Publicar Vigia Local
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar instalador
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
          ./scripts/build-windows.ps1 -Version $env:GITHUB_REF_NAME.Substring(1)
      - name: Publicar no GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME dist/VigiaLocal-Setup.exe dist/SHA256SUMS.txt --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME dist/VigiaLocal-Setup.exe dist/SHA256SUMS.txt --verify-tag --title "Vigia Local $env:GITHUB_REF_NAME" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  cloudflare:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Publicar site e app mobile
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 68c9669a40bccfdc431001cabe4fdbb2
        run: npm run deploy -- --keep-vars
